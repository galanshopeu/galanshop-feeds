name: Build language feeds
on:
  schedule:
    - cron: "0 21 * * *"   # каждый день в 21:00 UTC (22:00 по Центральной Европе), до забора файлов Merchant Center в 00:00
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feeds
        env:
          WIX_FEED_URL: ${{ secrets.WIX_FEED_URL }}
        run: python build_feeds.py
      - name: Commit changes
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs cache.json
          git diff --cached --quiet || git commit -m "Update feeds"
          git push
